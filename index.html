<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="application-name" content="Where2Go" />
    <meta name="apple-mobile-web-app-title" content="Where2Go" />
    <meta property="og:site_name" content="Where2Go" />
    <meta property="og:title" content="Where2Go" />
    <meta
      property="og:description"
      content="Kid-friendly events nearby on a daily map for libraries, nature centers, workshops, fairs, and family fun."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tflsguoyu.github.io/Where2Go/" />
    <meta property="og:image" content="https://tflsguoyu.github.io/Where2Go/assets/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Where2Go kid-friendly events nearby" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Where2Go" />
    <meta
      name="twitter:description"
      content="Kid-friendly events nearby on a daily map for libraries, nature centers, workshops, fairs, and family fun."
    />
    <meta name="twitter:image" content="https://tflsguoyu.github.io/Where2Go/assets/share-card.png" />
    <title>Where2Go</title>
    <link rel="manifest" href="manifest.webmanifest?v=20260612-cache-v100" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=20260612-cache-v100" />
  </head>
  <body>
    <main class="app-shell" aria-label="Where2Go event map">
      <header class="topbar">
        <div class="brand-block">
          <h1>
            Where2Go
            <span class="brand-mark" id="updatedLabel" aria-label="Kids version loading">
              <span class="brand-mark-label">Kids</span>
              <span class="brand-mark-version" id="brandVersionLabel">Loading</span>
            </span>
          </h1>
        </div>
        <div class="topbar-actions">
          <section class="event-filter" aria-label="Event filter">
            <div class="event-filter-control" id="eventFilterControl" role="group" aria-label="Show events">
              <button class="event-filter-button is-active" type="button" data-event-filter="all" aria-pressed="true">All</button>
              <button class="event-filter-button" type="button" data-event-filter="worldCup" aria-label="World Cup" aria-pressed="false"></button>
            </div>
          </section>
          <div class="more-menu">
            <button class="more-button" id="moreMenuButton" type="button" aria-label="More" aria-expanded="false" aria-controls="moreMenuPanel">
              <span class="more-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div class="more-panel" id="moreMenuPanel" hidden>
              <section class="more-section">
                <button class="more-link more-action" id="aboutToggle" type="button" aria-expanded="false" aria-controls="aboutPanel">About</button>
                <div class="about-panel" id="aboutPanel" hidden>
                  <div class="about-row">
                    <span>Updated</span>
                    <strong id="aboutUpdatedLabel">Loading</strong>
                  </div>
                </div>
                <button class="more-link more-action" id="coveredTownsToggle" type="button" aria-expanded="false" aria-controls="coveredTownsPanel">Covered towns</button>
                <div class="covered-towns-panel" id="coveredTownsPanel" hidden>
                  <ul class="town-list" id="coveredTownsList"></ul>
                </div>
                <button class="more-link more-action" id="statsToggle" type="button" aria-expanded="false" aria-controls="statsPanel">Stats</button>
                <div class="stats-panel" id="statsPanel" hidden>
                  <div class="stats-header">
                    <strong>Area visits</strong>
                    <span id="statsUpdated">Last 28 days</span>
                  </div>
                  <div class="stats-table" role="table" aria-label="Area visit stats">
                    <div class="stats-row stats-head" role="row">
                      <span role="columnheader">State</span>
                      <span role="columnheader">ZIP</span>
                      <span role="columnheader">Visits</span>
                    </div>
                    <div id="statsRows" class="stats-rows"></div>
                  </div>
                  <p class="stats-status" id="statsStatus">Loading stats</p>
                </div>
                <button class="more-link more-action" id="termsToggle" type="button" aria-expanded="false" aria-controls="termsPanel">Terms</button>
                <div class="terms-panel" id="termsPanel" hidden></div>
                <template id="termsTemplate">
                  <section class="terms-section">
                    <h3>Use of Where2Go</h3>
                    <p>Where2Go provides kid-friendly event listings and map views for personal, non-commercial use.</p>
                  </section>
                  <section class="terms-section">
                    <h3>Copyright and Ownership</h3>
                    <p>
                      © 2026 Where2Go. All rights reserved. The Where2Go name, site design, app structure, curated event data, and original
                      content may not be copied, reproduced, scraped, mirrored, redistributed, resold, or used to create a competing service
                      without written permission.
                    </p>
                  </section>
                  <section class="terms-section">
                    <h3>Event Information</h3>
                    <p>
                      Event details may change. Always verify dates, times, locations, registration requirements, costs, and age suitability with
                      the original event organizer before attending.
                    </p>
                  </section>
                  <section class="terms-section">
                    <h3>Third-Party Links</h3>
                    <p>
                      We link to third-party websites for event details, directions, analytics, and map services. Those sites are controlled by
                      their owners and may have separate terms and privacy practices.
                    </p>
                  </section>
                  <section class="terms-section">
                    <h3>Acceptable Use</h3>
                    <ul>
                      <li>Do not interfere with, overload, reverse engineer, or misuse the site.</li>
                      <li>Do not use automated scraping, bulk copying, or data extraction without written permission.</li>
                      <li>Do not present Where2Go content as your own or remove copyright notices.</li>
                    </ul>
                  </section>
                  <section class="terms-section">
                    <h3>No Warranty</h3>
                    <p>
                      Where2Go is provided as-is. We do not guarantee that listings are complete, current, error-free, uninterrupted, or suitable
                      for every family or child.
                    </p>
                  </section>
                  <section class="terms-section terms-changes">
                    <h3>Changes</h3>
                    <p>These terms may be updated from time to time. Continued use of the site after updates means you accept the revised terms.</p>
                  </section>
                </template>
              </section>
            </div>
          </div>
        </div>
      </header>

      <section class="install-prompt" id="installPrompt" hidden aria-live="polite">
        <img class="install-icon" src="assets/icon-192.png" width="36" height="36" alt="" />
        <div class="install-copy">
          <strong id="installPromptTitle">Install Where2Go</strong>
          <span id="installPromptText">Open faster from your home screen.</span>
        </div>
        <div class="install-actions">
          <button class="install-action" id="installPromptAction" type="button">Install</button>
          <button class="install-dismiss" id="installPromptDismiss" type="button">Not now</button>
        </div>
      </section>

      <nav class="date-strip" id="dateStrip" aria-label="Choose a date"></nav>

      <section class="map-section" aria-label="Events map for selected date">
        <div class="map-surface" id="mapSurface"></div>
      </section>

      <section class="event-detail" id="eventDetail" aria-live="polite"></section>

      <footer class="site-footer">
        <span>© 2026 Where2Go. All rights reserved.</span>
        <button class="site-footer-link" id="termsFooterButton" type="button">Terms of Service</button>
      </footer>

      <div class="terms-modal" id="termsModal" hidden aria-hidden="true">
        <button class="terms-modal-backdrop" id="termsModalBackdrop" type="button" aria-hidden="true" tabindex="-1"></button>
        <section class="terms-modal-panel" role="dialog" aria-modal="true" aria-labelledby="termsModalTitle">
          <header class="terms-modal-header">
            <h2 id="termsModalTitle">Terms of Service</h2>
            <button class="terms-modal-close" id="termsModalClose" type="button" aria-label="Close terms">✕</button>
          </header>
          <div class="terms-modal-content" id="termsModalContent"></div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js?v=20260612-cache-v100"></script>
    <script type="module" src="app.js?v=20260612-cache-v100"></script>
  </body>
</html>
