  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      content="Where2Go shows kid-friendly events nearby on a daily map for libraries, nature centers, workshops, fairs, and family fun."
    />
    <meta name="application-name" content="Where2Go" />
    <meta name="apple-mobile-web-app-title" content="Where2Go" />
    <meta property="og:site_name" content="Where2Go" />
    <meta property="og:title" content="Where2Go" />
    <meta
      property="og:description"
      content="Kid-friendly events nearby on a daily map for libraries, nature centers, workshops, fairs, and family fun."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tflsguoyu.github.io/Where2Go/" />
    <meta property="og:image" content="https://tflsguoyu.github.io/Where2Go/assets/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Where2Go kid-friendly events nearby" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Where2Go" />
    <meta
      name="twitter:description"
      content="Kid-friendly events nearby on a daily map for libraries, nature centers, workshops, fairs, and family fun."
    />
    <meta name="twitter:image" content="https://tflsguoyu.github.io/Where2Go/assets/share-card.png" />
    <title>Where2Go</title>
    <link rel="manifest" href="manifest.webmanifest?v=20260609-cache-v57" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=20260609-cache-v57" />
  </head>
  <body>
    <main class="app-shell" aria-label="Where2Go event map">
      <header class="topbar">
        <div>
          <h1>Where2Go</h1>
        </div>
        <div class="topbar-actions">
          <p class="updated" id="updatedLabel">Loading</p>
          <div class="more-menu">
            <button class="more-button" id="moreMenuButton" type="button" aria-label="More" aria-expanded="false" aria-controls="moreMenuPanel">
              <span class="more-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div class="more-panel" id="moreMenuPanel" hidden>
              <section class="more-section">
                <a class="more-link" href="terms.html">Terms</a>
                <a class="more-link" href="https://where2go.goatcounter.com" target="_blank" rel="noopener noreferrer">Analytics</a>
              </section>
              <section class="more-section" aria-labelledby="coveredTownsTitle">
                <h2 id="coveredTownsTitle">Covered towns</h2>
                <ul class="town-list" id="coveredTownsList"></ul>
              </section>
            </div>
          </div>
        </div>
      </header>

      <section class="install-prompt" id="installPrompt" hidden aria-live="polite">
        <img class="install-icon" src="assets/icon-192.png" width="36" height="36" alt="" />
        <div class="install-copy">
          <strong id="installPromptTitle">Install Where2Go</strong>
          <span id="installPromptText">Open faster from your home screen.</span>
        </div>
        <div class="install-actions">
          <button class="install-action" id="installPromptAction" type="button">Install</button>
          <button class="install-dismiss" id="installPromptDismiss" type="button">Not now</button>
        </div>
      </section>

      <nav class="date-strip" id="dateStrip" aria-label="Choose a date"></nav>

      <section class="map-section" aria-label="Events map for selected date">
        <div class="map-surface" id="mapSurface"></div>
      </section>

      <section class="event-detail" id="eventDetail" aria-live="polite"></section>

      <footer class="site-footer">
        <span>© 2026 Where2Go. All rights reserved.</span>
        <a href="terms.html">Terms of Service</a>
      </footer>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js?v=20260609-cache-v57"></script>
    <script type="module" src="app.js?v=20260609-cache-v57"></script>
  </body>
</html>
